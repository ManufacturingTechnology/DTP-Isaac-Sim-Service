# From: https://docs.isaacsim.omniverse.nvidia.com/5.1.0/installation/install_container.html

# Verify NVIDIA Driver Version
#	nvidia-smi

# Verify NVIDIA Container Toolkit
#	docker run --rm --runtime=nvidia --gpus all debian nvidia-smi
#	docker run --rm --runtime=nvidia --gpus all ubuntu nvidia-smi

# Check Isaac Sim Compatibility
#	docker run --entrypoint bash -it --gpus all --rm --network=host nvcr.io/nvidia/isaac-sim:5.1.0 ./isaac-sim.compatibility_check.sh --/app/quitAfter=10 --no-window

services:

  isaac-sim:
    image: amt-dtp-iss
    container_name: amt-dtp-iss
    build:
      context: build
      dockerfile: Dockerfile
#      args:
#        ISAAC_SIM_VERSION: 5.1.0
#    restart: "no"
    restart: unless-stopped
    networks:
      - amt-dtp
    ports:
      - '8211:8211'   # Isaac Sim WebRTC Streaming Client Port
      - '49100:49100' # Isaac Sim WebRTC Streaming Client Port
      - '47998:47998' # Isaac Sim WebRTC Streaming Client Port
#      - '11311:11311' # ROS 2
      - '8011:8011' # Isaac Sim Kit Services Core API
      - '8012:8012' # AMT DTP ISE API
      - '8013:8013' # AMT DTP ISCP API
    environment:
       - NVIDIA_VISIBLE_DEVICES=all
       - NVIDIA_DRIVER_CAPABILITIES=all
#      - ACCEPT_EULA=Y
#      - ROS_DOMAIN_ID=0


    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
#              count: 1


    volumes:
      - amt-dtp-iss-cache-main:/isaac-sim/.cache:rw
      - amt-dtp-iss-cache-compute:/isaac-sim/.nv/ComputeCache:rw
      - amt-dtp-iss-logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - amt-dtp-iss-config:/isaac-sim/.nvidia-omniverse/config:rw
#      - amt-dtp-iss-data:/isaac-sim/.local/share/ov/data:rw
#      - amt-dtp-iss-pkg:/isaac-sim/.local/share/ov/pkg:rw
      - amt-dtp-iss-files:/files:rw 

volumes:
  amt-dtp-iss-cache-main:
    name: 'amt-dtp-iss-cache-main'
  amt-dtp-iss-cache-compute:
    name: 'amt-dtp-iss-cache-compute'
  amt-dtp-iss-logs:
    name: 'amt-dtp-iss-logs'
  amt-dtp-iss-config:
    name: 'amt-dtp-iss-config'
#  amt-dtp-iss-data:
#    name: 'amt-dtp-iss-data'
#  amt-dtp-iss-pkg:
#    name: 'amt-dtp-iss-pkg'
  amt-dtp-iss-files:
    name: 'amt-dtp-iss-files'

networks:
  amt-dtp:
    name: 'amt-dtp'


